<!-- Pagina de primer paso de registrarse  Visitor o Artista -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Virtual Art Museum is a website that allows you to explore and discover art from around the world.">

    <title>Virtual Art Meseum | Register</title>
    
    <link rel="stylesheet" href="../style/general.css">
    <link rel="stylesheet" href="../style/Register_P1.css">
</head>

<body>

    <!-- Encabezado con el título de la página -->
    <header>
        <h1>Choose your account type</h1>
    </header>

    <!-- Contenido principal para elegir el tipo de cuenta -->
    <main class="container">

        <!-- Cuadrados decorativos del fondo -->
        <div class="carre bleu"></div>
        <div class="carre red"></div>

        <!-- Enlace al formulario de registro para visitantes -->
        <div class="visitor">
            <a href="./Register_P2.html">Visitor</a>
        </div>

        <!-- Ilustración central entre las dos opciones -->
        <div class="figure">
            <img src="../image/figure1.webp" alt="Illustration of an artist">
        </div>

        <!-- Enlace al formulario de registro para artistas -->
        <div class="artist">
            <a href="./Register_P2.html">Artist</a>
        </div>
    </main>
    

    <script src="../script/script.js"></script>
</body>
</html>
